<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SINTRAINCES — Panel Administrativo</title>
<link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
</head>
<body>
<div id="login" class="screen">
  <div class="card login-card">
    <div class="brand">SINTRAINCES</div>
    <h1>Panel administrativo</h1>
    <p>Gestión sindical y afiliados</p>
    <form id="loginForm">
      <label>Usuario o correo
        <input id="loginUser" autocomplete="username" required>
      </label>
      <label>Contraseña
        <input id="loginPassword" type="password" autocomplete="current-password" required>
      </label>
      <button>Ingresar</button>
      <div id="diagnosticMsg" style="display:none;margin-top:10px;font-size:13px;opacity:.85;"></div><div id="loginMsg" class="msg"></div>
    </form>
  </div>
</div>

<div id="app" class="hidden">
<header class="topbar">
  <div><strong>SINTRAINCES</strong><span>Panel administrativo</span></div>
  <div class="top-user"><span id="userName"></span><small id="userRole"></small><button id="logout" class="ghost">Cerrar sesión</button></div>
</header>
<div id="passwordPanel" class="password-panel hidden">
  <div class="password-card">
    <strong>Debes cambiar la contraseña temporal</strong>
    <p>Por seguridad, establece una contraseña personal antes de continuar.</p>
    <form id="changePasswordForm">
      <label>Nueva contraseña<input id="newPassword" type="password" minlength="8" required></label>
      <label>Confirmar contraseña<input id="confirmPassword" type="password" minlength="8" required></label>
      <button>Actualizar contraseña</button>
      <button type="button" id="cancelPassword" class="secondary">Cancelar</button>
      <div id="passwordMsg" class="msg"></div>
    </form>
  </div>
</div>
<div class="layout">
<aside>
  <button data-view="inicio" class="nav active">Inicio</button>
  <button data-view="afiliados" class="nav">Afiliados</button>
  <button data-view="solicitudes" class="nav">Solicitudes</button>
  <button data-view="reportes" class="nav">Reportes</button>
  <button data-view="reclamos" class="nav">Reclamos y sugerencias</button>
  <button data-view="usuarios" class="nav">Usuarios</button>
  <button data-view="organizacion" class="nav">Organización sindical</button>
  <button data-view="auditoria" class="nav">Auditoría</button>
</aside>
<main id="main"></main>
</div>
</div>
<script src="admin.js?v=1.50.7"></script>
<div style="position:fixed;bottom:6px;right:8px;font-size:10px;opacity:.45">SINTRAINCES v1.50.6</div></body>
</html>
