<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal SINTRAINCES</title>
<link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
body{margin:0;background:linear-gradient(135deg,#eef4fb,#f8fafc);font-family:Arial,sans-serif;color:#243247}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(460px,100%);background:#fff;border:1px solid #e0e7f0;border-radius:20px;padding:30px;box-shadow:0 12px 40px rgba(18,45,78,.12)}.brand{text-align:center;font-size:30px;font-weight:900;color:#174ea6}.subtitle{text-align:center;color:#687384;margin:8px 0 24px}.card h1{font-size:23px;color:#173f7a;text-align:center;margin:0 0 18px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;color:#45515f}.field input{width:100%;box-sizing:border-box;margin-top:6px;padding:12px;border:1px solid #ccd4df;border-radius:9px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.actions button{flex:1;min-width:150px;padding:12px 16px;border:0;border-radius:9px;background:#174ea6;color:#fff;font-weight:800;cursor:pointer}.actions .secondary{background:#eef3fa;color:#173f7a}.msg{margin-top:14px;min-height:20px;font-size:13px;text-align:center}.links{text-align:center;margin-top:20px;padding-top:18px;border-top:1px solid #e5e9ef}.links a{color:#174ea6;font-weight:800;text-decoration:none}.links a:hover{text-decoration:underline}.note{font-size:12px;color:#687384;text-align:center;margin-top:20px;line-height:1.5}.hidden{display:none}
</style>
</head>
<body><main class="wrap"><section class="card">
<div class="brand">SINTRAINCES</div><p class="subtitle">Portal de servicios sindicales</p>
<h1>Ingresar al Portal</h1>
<form id="loginForm">
<div class="field"><label>Correo electrónico<input id="email" type="email" autocomplete="username" required></label></div>
<div class="field"><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label></div>
<div class="actions"><button type="submit">Ingresar</button></div>
<div id="msg" class="msg"></div>
</form>
<div class="links"><div>¿Eres afiliado y aún no tienes acceso?</div><a href="portal_afiliado.html?registro=1">Registrarte en el portal</a><div style="margin-top:10px"><a href="portal_afiliado.html?recuperar=1">¿Olvidaste tu contraseña?</a></div></div>
<p class="note">Una misma puerta de acceso identifica automáticamente el tipo de cuenta y dirige al usuario al espacio que le corresponde.</p>
</section></main>
<script>
const $=id=>document.getElementById(id); let sb;
function msg(t,error=false){$('msg').textContent=t;$('msg').style.color=error?'#b42318':'#45515f'}
async function init(){
 try{const cfg=window.SINTRAINCES_CONFIG;if(!cfg?.SUPABASE_URL||!cfg?.SUPABASE_PUBLISHABLE_KEY)throw new Error('Configuración de Supabase incompleta.');sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);
 const {data:{session}}=await sb.auth.getSession();if(session)await route(session);
 }catch(e){console.error(e);msg(e.message||e,true)}
}
async function route(session){
 msg('Verificando perfil…');
 const {data,error}=await sb.rpc('mi_perfil_actual');if(error)throw error;const p=Array.isArray(data)?data[0]:data;
 if(!p||p.activo===false)throw new Error('La cuenta no tiene un perfil SINTRAINCES activo.');
 if(['admin_nacional','admin_seccional'].includes(p.rol))location.href='admin.html';
 else if(p.rol==='afiliado')location.href='portal_afiliado.html';
 else if(p.rol==='dirigente')location.href='portal_dirigente.html';
 else throw new Error('El tipo de cuenta aún no tiene un portal configurado.');
}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{msg('Conectando…');const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await route(data.session)}catch(e){console.error(e);msg(e.message||'No se pudo iniciar sesión.',true)}});
init();
</script></body></html>
